# Push a tag like v0.2.0 (scripts/release.sh does it) to build the macOS app and publish a GitHub
# release whose notes are that version's section of CHANGELOG.md.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    # Releases come from version tags only, also when started by hand.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      # Actions are pinned to commit SHAs so a moved tag can't change what builds the release.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The write token is for tauri-action only, not for every install script in git config.
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - name: Release notes from CHANGELOG.md
        id: notes
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## "v" " {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          # A random delimiter, so no line in the notes can end the value early.
          eof="NOTES_$(openssl rand -hex 16)"
          {
            echo "body<<$eof"
            cat notes.md
            echo ""
            echo "### Install"
            echo "Download the \`.dmg\` below, open it and drag nekotrail to Applications. The app is not notarized yet: on first launch, right-click it and choose Open, or run \`xattr -dr com.apple.quarantine /Applications/nekotrail.app\`."
            echo "$eof"
          } >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: nekotrail ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          args: --target universal-apple-darwin
