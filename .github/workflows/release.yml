# Push a tag like v0.2.0 to build the macOS app and attach it to a draft GitHub release.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: nekotrail ${{ github.ref_name }}
          releaseBody: |
            Download the `.dmg`, open it and drag nekotrail to Applications.
            The app is not notarized yet. On first launch, right-click the app and choose Open,
            or run `xattr -dr com.apple.quarantine /Applications/nekotrail.app`.
          releaseDraft: true
          args: --target universal-apple-darwin
