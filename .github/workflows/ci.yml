name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI runs code from pull requests.
permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      # Actions are pinned to commit SHAs so a moved tag can't change what runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      # THIRD_PARTY_NOTICES.md matches the dependencies, and every bundled component has a licence text.
      - run: bun scripts/third-party-notices.ts --check
      - run: bunx tsc --noEmit
      - run: bun run build
      - run: bun test tests/
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri

  # Linux (new, experimental): the same checks against WebKitGTK. 22.04 matches the release build,
  # whose glibc sets the oldest distro the .deb runs on.
  check-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: WebKitGTK and the other Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun run build
      - run: bun test tests/
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri

  # Dependency checks. Rust: licences (no GPL or AGPL), RustSec advisories, bans and sources, per
  # src-tauri/deny.toml. JavaScript: known vulnerabilities rated high or critical in the app, the site
  # and the extension. Dependabot (.github/dependabot.yml) opens the upgrade PRs.
  security:
    runs-on: ubuntu-22.04
    env:
      DENY_VERSION: "0.20.2"
      DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      # The release binary, pinned by checksum, instead of a 5-minute cargo install.
      - name: Install cargo-deny
        run: |
          f="cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL -o deny.tar.gz "https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}/${f}.tar.gz"
          echo "${DENY_SHA256}  deny.tar.gz" | sha256sum -c -
          tar -xzf deny.tar.gz
          install -m 0755 "${f}/cargo-deny" "$HOME/.cargo/bin/cargo-deny"
      - run: cargo deny check advisories bans licenses sources
        working-directory: src-tauri
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: bun audit (app, site, extension)
        run: |
          for d in . site extensions/vscode; do
            echo "::group::bun audit in $d"
            (cd "$d" && bun audit --audit-level=high)
            echo "::endgroup::"
          done

  # The VS Code / Cursor extension in extensions/vscode: type-check, unit tests, and the .vsix.
  # It is never published from CI; the .vsix is kept as a build artifact for a week.
  vscode-extension:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: extensions/vscode
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      # vsce needs Node 22 or newer.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun test test/
      - run: bun run package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nekotrail-vsix
          path: extensions/vscode/nekotrail.vsix
          retention-days: 7
